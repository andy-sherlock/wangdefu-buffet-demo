name: 发布已保存菜单
on:
  repository_dispatch:
    types: [menu-updated]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: 生成同版本顾客网页和图片
        run: node publisher/build.mjs
        env:
          SERVICE_URL: ${{ vars.SERVICE_URL }}
          PUBLISHER_KEY: ${{ secrets.PUBLISHER_KEY }}
          PREVIOUS_SITE_URL: https://andy-sherlock.github.io/wangdefu-buffet-demo/
          CUSTOMER_ROOT: next
          OUTPUT_DIR: dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
